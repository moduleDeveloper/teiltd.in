name: Community Digital Home Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/community-digital-home

            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull origin main

            cd frontend
            npm install
            npm run build

            cd ../backend
            npm install

            pm2 restart community-digital-home || pm2 start npm --name community-digital-home -- start

            pm2 save