name: Community Digital Home Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS (develop)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/setu-website-develop
            git fetch origin
            git reset --hard origin/develop
            git log --oneline -1
            git lfs install --local
            git lfs pull
            cd frontend
            printf "VITE_API_BASE_URL=%s\n" "${{ secrets.VITE_API_BASE_URL }}" > .env
            npm install
            npm run build
            cd ../backend
            npm install
            pm2 restart setu-website-develop --update-env
            pm2 save